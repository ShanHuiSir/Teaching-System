services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: teaching-system-backend:demo
    container_name: teaching-system-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: fake
      APP_UPLOAD_ROOT: /data/uploads
      TEACHING_EVAL_USERNAME: teacher
      TEACHING_EVAL_PASSWORD: "123456"
    volumes:
      - teaching_uploads:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: teaching-system-frontend:demo
    container_name: teaching-system-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  teaching_uploads:
