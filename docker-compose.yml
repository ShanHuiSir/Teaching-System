services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: teaching-system-ai-service:demo
    container_name: teaching-system-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      AI_SERVICE_SERVER_URL: http://localhost:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-4096}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      EVAL_LOG_DIR: /app/logs
    volumes:
      - teaching_ai_logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: teaching-system-backend:demo
    container_name: teaching-system-backend
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_UPLOAD_ROOT: /data/uploads
      APP_AI_REAL_ENABLED: "true"
      APP_AI_REAL_ENDPOINT_URL: http://ai-service:8000/api/evaluate/real
      APP_PREPROCESS_ENABLED: "false"
      APP_PREPROCESS_ENDPOINT_URL: http://ai-service:8000/api/preprocess
      APP_AI_EVAL_LOG_ENABLED: "false"
      APP_AI_EVAL_LOG_URL: http://ai-service:8000/api/eval-log
      TEACHING_EVAL_USERNAME: teacher
      TEACHING_EVAL_PASSWORD: "123456"
    volumes:
      - teaching_uploads:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: teaching-system-frontend:demo
    container_name: teaching-system-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  teaching_uploads:
  teaching_ai_logs:
