# Production profile: override every placeholder through deployment secrets.
spring.datasource.url=${TEACHING_EVAL_DB_URL}
spring.datasource.username=${TEACHING_EVAL_DB_USERNAME}
spring.datasource.password=${TEACHING_EVAL_DB_PASSWORD}
spring.datasource.driver-class-name=${TEACHING_EVAL_DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate

app.auth.username=${TEACHING_EVAL_USERNAME}
app.auth.password=${TEACHING_EVAL_PASSWORD}
app.auth.cookie-secure=true
app.cors.allowed-origins=${TEACHING_EVAL_CORS_ALLOWED_ORIGINS}
app.upload.root=${TEACHING_EVAL_UPLOAD_ROOT:/var/lib/teaching-system/uploads}

app.preprocess.enabled=${TEACHING_EVAL_PREPROCESS_ENABLED:true}
app.preprocess.endpoint-url=${TEACHING_EVAL_PREPROCESS_URL:http://127.0.0.1:8000/api/preprocess}
app.ai.real.enabled=${TEACHING_EVAL_REAL_AI_ENABLED:true}
app.ai.real.endpoint-url=${TEACHING_EVAL_REAL_AI_URL:http://127.0.0.1:8000/api/evaluate/real}
app.ai.eval-log.enabled=${TEACHING_EVAL_EVAL_LOG_ENABLED:true}
app.ai.eval-log-url=${TEACHING_EVAL_EVAL_LOG_URL:http://127.0.0.1:8000/api/eval-log}
