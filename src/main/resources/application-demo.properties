# Demo profile: stable offline-friendly mode for classroom presentation.
spring.datasource.url=jdbc:h2:mem:teachingeval;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

app.auth.cookie-secure=false
app.ai.real.enabled=false
app.preprocess.enabled=false
app.ai.eval-log.enabled=false
