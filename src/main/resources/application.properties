server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# H2 Database
spring.datasource.url=jdbc:h2:mem:teachingeval;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
# 安全策略：H2 控制台已禁用。开发调试时如需启用，改回 true 并重启
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File upload
app.upload.root=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Demo authentication — primary account + comma-separated additional accounts (user:pass)
app.auth.enabled=true
app.auth.username=${TEACHING_EVAL_USERNAME:teacher}
app.auth.password=${TEACHING_EVAL_PASSWORD:123456}
app.auth.accounts=temp:123456
app.auth.cookie-name=auth_token
app.auth.cookie-secure=false
app.auth.session-ttl-hours=12
app.auth.remember-ttl-days=7

# CORS allow-list. Add the deployed frontend origin in production.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Python preprocessing service
app.preprocess.enabled=false
app.preprocess.endpoint-url=http://localhost:8000/api/preprocess
app.preprocess.connect-timeout-ms=3000
app.preprocess.read-timeout-ms=10000

# Python real AI evaluation service
app.ai.real.enabled=true
app.ai.real.endpoint-url=http://localhost:8000/api/evaluate/real
app.ai.real.connect-timeout-ms=3000
app.ai.real.read-timeout-ms=60000
app.ai.rate-limit-per-minute=10
app.ai.eval-log.enabled=false
app.ai.eval-log-url=http://localhost:8000/api/eval-log

# Springdoc OpenAPI - merged view: Java system + Python AI service
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# Note: Swagger UI group names (Java 教学系统 / AI 服务) are configured
# programmatically in OpenApiConfig.java to avoid .properties encoding issues.
