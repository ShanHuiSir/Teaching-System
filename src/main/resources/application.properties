server.forward-headers-strategy=framework

# H2 Database
spring.datasource.url=jdbc:h2:mem:teachingeval;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload
app.upload.root=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Python preprocessing service
app.preprocess.enabled=false
app.preprocess.endpoint-url=http://localhost:8000/api/preprocess
app.preprocess.connect-timeout-ms=3000
app.preprocess.read-timeout-ms=10000

# Springdoc OpenAPI - explicit paths for reverse proxy compatibility
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
