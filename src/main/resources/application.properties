server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# H2 Database
spring.datasource.url=jdbc:h2:mem:teachingeval;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload
app.upload.root=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Python preprocessing service
app.preprocess.enabled=false
app.preprocess.endpoint-url=http://localhost:8000/api/preprocess
app.preprocess.connect-timeout-ms=3000
app.preprocess.read-timeout-ms=10000

# Python real AI evaluation service
app.ai.real.enabled=false
app.ai.real.endpoint-url=http://localhost:8000/api/evaluate/real
app.ai.real.connect-timeout-ms=3000
app.ai.real.read-timeout-ms=30000

# Springdoc OpenAPI - merged view: Java system + Python AI service
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# Note: Swagger UI group names (Java 教学系统 / AI 服务) are configured
# programmatically in OpenApiConfig.java to avoid .properties encoding issues.
