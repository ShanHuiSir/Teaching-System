<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activePage)">
  <aside class="md-sidebar" id="app-sidebar">
    <div class="md-sidebar__header">
      <span class="md-sidebar__brand">教学评价系统</span>
      <button class="md-sidebar__toggle" id="sidebar-toggle" aria-label="折叠侧边栏">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
    </div>
    <nav class="md-sidebar__nav">
      <div class="status-group">
        <span class="status-group__hint">作业状态</span>
        <!-- 1. 未审批 — status page -->
        <a href="/assignments/pending" class="sidebar-hl-item sidebar-hl-item--pending" th:classappend="${activePage == 'pending' ? 'active' : ''}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm1 3.8h-1.2v-2.5h-1.2v3.7h2.4v-1.2zM14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h4v-2H6V4h7v5h5v3h2V8l-6-6z"/></svg>
          <span>未审批</span>
          <span class="sidebar-hl-item__badge" id="badge-pending">--</span>
        </a>

        <!-- 2. AI已审批 — status page -->
        <a href="/assignments/ai-reviewed" class="sidebar-hl-item sidebar-hl-item--ai" th:classappend="${activePage == 'ai-reviewed' ? 'active' : ''}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 11.75c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25zm6 0c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-12.5c-2.67 0-4.85 2.03-4.85 4.5h1.8c0-1.66 1.34-3 3.05-3 1.66 0 3.05 1.32 3.05 3h1.8c0-2.47-2.18-4.5-4.85-4.5z"/></svg>
          <span>AI 已审批</span>
          <span class="sidebar-hl-item__badge" id="badge-ai">--</span>
        </a>

        <!-- 3. 已完成 — status page -->
        <a href="/assignments/completed" class="sidebar-hl-item sidebar-hl-item--done" th:classappend="${activePage == 'completed' ? 'active' : ''}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>已完成</span>
          <span class="sidebar-hl-item__badge" id="badge-done">--</span>
        </a>
      </div>

      <div class="sidebar-divider"></div>

      <!-- 4. 学生管理 — functional page -->
      <a href="/students" class="sidebar-hl-item sidebar-hl-item--students" th:classappend="${activePage == 'students' ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>学生管理</span>
      </a>

      <!-- 5. 作业提交 — functional page -->
      <a href="/submit" class="sidebar-hl-item sidebar-hl-item--submit" th:classappend="${activePage == 'submit' ? 'active' : ''}" title="作业提交">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        <span>作业提交</span>
      </a>

      <!-- 6. 导出成绩 — functional page -->
      <a href="/export" class="sidebar-hl-item sidebar-hl-item--export" th:classappend="${activePage == 'export' ? 'active' : ''}" title="导出成绩">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>导出成绩</span>
      </a>
    </nav>
    <div class="md-sidebar__actions">
      <button class="md-btn md-btn--outlined logout-link" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>退出</span>
      </button>
    </div>
  </aside>
  <script>
    (function() {
      var sidebar = document.getElementById('app-sidebar');
      if (localStorage.getItem('sidebar-collapsed') === 'true') {
        sidebar.classList.add('md-sidebar--collapsed');
        document.body.classList.add('has-sidebar--collapsed');
      }
      document.getElementById('sidebar-toggle').onclick = function() {
        var collapsed = sidebar.classList.toggle('md-sidebar--collapsed');
        document.body.classList.toggle('has-sidebar--collapsed');
        localStorage.setItem('sidebar-collapsed', collapsed);
      };
    })();

    (function() {
      var bp = document.getElementById('badge-pending');
      var ba = document.getElementById('badge-ai');
      var bd = document.getElementById('badge-done');
      if (!bp) return;
      fetch('/api/statistics/summary')
        .then(function(res) { return res.ok ? res.json() : null; })
        .then(function(data) {
          if (!data) return;
          bp.textContent = data.submissionCount - data.aiEvaluatedCount;
          ba.textContent = data.aiEvaluatedCount - data.teacherConfirmedCount;
          bd.textContent = data.teacherConfirmedCount;
        })
        .catch(function() {});
    })();
  </script>
</th:block>
</html>
