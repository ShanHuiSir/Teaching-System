<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 学生管理</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .action-menu { position: relative; display: inline-block; }
    .action-menu__trigger { width: 28px; height: 28px; padding: 0; border-radius: var(--md-sys-shape-full); border: none; background: transparent; color: var(--md-sys-color-on-surface-variant); font-size: 18px; line-height: 28px; cursor: pointer; text-align: center; transition: background var(--md-sys-duration-short) var(--md-sys-easing-standard); }
    .action-menu__trigger:hover { background: var(--md-sys-color-surface-container-highest); }
    .action-menu__item { display: flex; align-items: center; gap: var(--md-space-2); height: 32px; padding: 0 var(--md-space-3); border: none; border-radius: var(--md-sys-shape-xs); background: transparent; color: var(--md-sys-color-on-surface); font: var(--md-typescale-body-medium); cursor: pointer; width: 100%; text-align: left; white-space: nowrap; }
    .action-menu__item:hover { background: var(--md-sys-color-surface-container-low); }
    .action-menu__item--danger { color: var(--md-sys-color-error); }
    .action-menu__item--danger:hover { background: var(--md-sys-color-error-container); }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--md-space-3); padding: var(--md-space-3) var(--md-space-4); border-top: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface-variant); font: var(--md-typescale-body-medium); }
    .pagination-bar__actions { display: flex; gap: var(--md-space-2); }

    /* Portal dropdown — rendered at body level, escapes all table clipping */
    .portal-dropdown {
      position: fixed;
      z-index: 2147483647;
      min-width: 100px;
      padding: 4px;
      border-radius: 8px;
      background: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      animation: portalSlideIn .2s ease both;
    }
    @keyframes portalSlideIn {
      from { opacity: 0; transform: translateY(0); }
      to   { opacity: 1; transform: translateY(4px); }
    }
    .portal-dropdown--up {
      animation-name: portalSlideInUp;
    }
    @keyframes portalSlideInUp {
      from { opacity: 0; transform: translateY(0); }
      to   { opacity: 1; transform: translateY(-4px); }
    }

    .portal-dropdown__item {
      display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 12px;
      border: none; border-radius: 4px;
      background: transparent; color: #333;
      font: 400 13px/1.5 "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      cursor: pointer;
      width: 100%; text-align: left; white-space: nowrap;
      text-decoration: none;
    }
    .portal-dropdown__item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .65; }
    .portal-dropdown__item:hover { background: #F8FAFD; }
    .portal-dropdown__item--danger { color: var(--md-sys-color-error); }
    .portal-dropdown__item--danger:hover { background: #FFF0F0; }
  </style>
</head>
<body class="has-sidebar">
  <th:block th:replace="~{fragments/sidebar :: sidebar(activePage='students')}"></th:block>

  <main class="md-page">
    <div class="md-page-header">
      <h2>学生管理</h2>
      <div class="md-page-header__actions">
        <button class="md-btn md-btn--outlined" type="button" id="reset-demo-data">重置数据</button>
        <button class="md-btn md-btn--filled" type="button">新增学生</button>
      </div>
    </div>

    <div class="md-toolbar">
      <div class="md-toolbar__search">
        <input class="md-field__input" type="search" placeholder="搜索姓名或学号...">
      </div>
    </div>

    <div class="md-card">
      <table class="md-table">
        <thead>
          <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>班级</th>
            <th style="width: 120px;">操作</th>
          </tr>
        </thead>
        <tbody id="student-table-body">
          <tr>
            <td colspan="4" style="text-align:center;color:var(--md-sys-color-on-surface-variant);">正在加载...</td>
          </tr>
        </tbody>
      </table>
      <div class="pagination-bar">
        <span id="student-page-info">第 -- 页 / 共 -- 页，共 -- 名学生</span>
        <div class="pagination-bar__actions">
          <button class="md-btn md-btn--outlined" type="button" id="student-prev-page">上一页</button>
          <button class="md-btn md-btn--outlined" type="button" id="student-next-page">下一页</button>
        </div>
      </div>
    </div>
  </main>

  <div class="md-dialog-overlay hidden" id="add-student-dialog">
    <div class="md-dialog">
      <div class="md-dialog__title">新增学生</div>
      <form id="add-student-form">
        <label class="md-field">
          <span class="md-field__label">学号</span>
          <input class="md-field__input" name="studentNo" required autocomplete="off">
        </label>
        <label class="md-field">
          <span class="md-field__label">姓名</span>
          <input class="md-field__input" name="name" required autocomplete="off">
        </label>
        <label class="md-field">
          <span class="md-field__label">班级</span>
          <input class="md-field__input" name="className" required autocomplete="off">
        </label>
        <div class="md-dialog__actions" style="margin-top: var(--md-space-4);">
          <button class="md-btn md-btn--outlined" type="button" id="add-cancel">取消</button>
          <button class="md-btn md-btn--filled" type="submit">确认新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Portal anchor — all action menus render here, outside table -->
  <div id="global-dropdown-portal"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/logout-dialog.js"></script>
  <script>
    const studentTbody = document.getElementById('student-table-body');
    const addBtn = document.querySelector('.md-page-header__actions .md-btn--filled');
    const addSubmitBtn = document.querySelector('#add-student-form .md-btn--filled');
    const addDialog = document.getElementById('add-student-dialog');
    const addForm = document.getElementById('add-student-form');
    const addCancel = document.getElementById('add-cancel');
    const searchInput = document.querySelector('.md-toolbar__search input');
    const resetDemoDataBtn = document.getElementById('reset-demo-data');
    const addBtnText = addSubmitBtn ? addSubmitBtn.textContent : '确认新增';
    const portal = document.getElementById('global-dropdown-portal');

    let pageIndex = 0;
    let pageSize = 20;
    let totalPages = 1;
    let totalElements = 0;
    let searchTimer = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function renderTable(list) {
      if (list.length === 0) {
        studentTbody.innerHTML = '<tr><td colspan="4"><div class="md-empty-state"><div class="md-empty-state__icon">&#128100;</div><div class="md-empty-state__text">暂无学生，请先新增</div></div></td></tr>';
        return;
      }
      // Menu is no longer nested in <td> — rendered via portal on click
      studentTbody.innerHTML = list.map(function(s) {
        return '<tr><td>' + escapeHtml(s.studentNo) + '</td><td>' + escapeHtml(s.name) + '</td><td><span class="md-chip">' + escapeHtml(s.className) + '</span></td><td><div class="action-menu"><button class="action-menu__trigger" data-action-trigger="' + s.id + '" data-student-name="' + escapeHtml(s.name) + '" aria-label="操作菜单">&#8942;</button></div></td></tr>';
      }).join('');
    }

    function renderPagination() {
      var displayTotalPages = totalPages || 1;
      document.getElementById('student-page-info').textContent =
        '第 ' + (pageIndex + 1) + ' 页 / 共 ' + displayTotalPages + ' 页，共 ' + totalElements + ' 名学生';
      document.getElementById('student-prev-page').disabled = pageIndex <= 0;
      document.getElementById('student-next-page').disabled = pageIndex >= displayTotalPages - 1;
    }

    function goToPage(newPage) {
      pageIndex = Math.max(newPage, 0);
      loadStudents();
    }

    async function loadStudents() {
      studentTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:32px;"><span class="spinner"></span></td></tr>';
      try {
        var params = new URLSearchParams({
          page: String(pageIndex),
          size: String(pageSize)
        });
        var keyword = searchInput.value.trim();
        if (keyword) params.set('keyword', keyword);
        var res = await fetch('/api/students/page?' + params.toString());
        if (!res.ok) { var msg = await extractError(res); throw new Error(msg); }
        var data = await res.json();
        pageIndex = data.page || 0;
        totalPages = data.totalPages || 1;
        totalElements = data.totalElements || 0;
        if (totalElements > 0 && pageIndex >= totalPages) {
          pageIndex = totalPages - 1;
          await loadStudents();
          return;
        }
        renderTable(data.content || []);
        renderPagination();
      } catch (e) {
        showError(e.message);
        studentTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--md-sys-color-error);padding:32px;">加载失败，请刷新重试</td></tr>';
      }
    }

    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        pageIndex = 0;
        loadStudents();
      }, 250);
    });

    document.getElementById('student-prev-page').addEventListener('click', function() {
      if (pageIndex > 0) goToPage(pageIndex - 1);
    });
    document.getElementById('student-next-page').addEventListener('click', function() {
      if (pageIndex < totalPages - 1) goToPage(pageIndex + 1);
    });

    function openAddDialog() { addDialog.classList.remove('hidden'); addForm.querySelector('input').focus(); }
    function closeAddDialog() { addDialog.classList.add('hidden'); addForm.reset(); addBtn.focus(); }

    addBtn.onclick = openAddDialog;
    addCancel.onclick = closeAddDialog;
    addDialog.onclick = function(e) { if (e.target === addDialog) closeAddDialog(); };

    resetDemoDataBtn.addEventListener('click', async function() {
      if (!confirm('确定重置演示数据吗？当前学生、作业和评价数据会恢复为初始化状态。')) return;
      resetDemoDataBtn.disabled = true;
      try {
        var res = await fetch('/api/dev/reset-demo-data', { method: 'POST' });
        if (!res.ok) { var err = await extractError(res); throw new Error(err); }
        pageIndex = 0;
        searchInput.value = '';
        try {
          localStorage.setItem('assignment-data-version', JSON.stringify({
            reason: 'demo-data-reset',
            time: Date.now()
          }));
        } catch (e) {}
        showSuccess('演示数据已重置');
        await loadStudents();
      } catch (err) {
        showError(err.message);
      } finally {
        resetDemoDataBtn.disabled = false;
      }
    });

    addForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (addSubmitBtn) { addSubmitBtn.disabled = true; addSubmitBtn.textContent = '保存中...'; }
      var data = Object.fromEntries(new FormData(addForm));
      try {
        var res = await fetch('/api/students', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        if (!res.ok) { var err = await extractError(res); throw new Error(err); }
        var created = await res.json();
        closeAddDialog();
        showSuccess('已新增学生：' + created.name);
        await loadStudents();
      } catch (err) {
        showError(err.message);
      } finally {
        if (addSubmitBtn) { addSubmitBtn.disabled = false; addSubmitBtn.textContent = addBtnText; }
      }
    });

    // ── Portal-based action menu ──
    var openMenuId = null;

    function closePortalMenu() {
      if (openMenuId != null) {
        var el = document.getElementById('portal-menu-' + openMenuId);
        if (el) el.remove();
        openMenuId = null;
      }
    }

    function openPortalMenu(trigger, id, studentName) {
      closePortalMenu();

      var rect = trigger.getBoundingClientRect();
      var gap = 4;
      var noOverlapMargin = 8;

      // No-overlap zone: pagination bar (上一页 / 下一页)
      var paginationBar = document.querySelector('.pagination-bar');
      var paginationTop = paginationBar
        ? paginationBar.getBoundingClientRect().top
        : window.innerHeight;
      var safeBottom = paginationTop - noOverlapMargin;

      // Create menu in portal
      var menu = document.createElement('div');
      menu.className = 'portal-dropdown';
      menu.id = 'portal-menu-' + id;
      menu.innerHTML =
        '<a class="portal-dropdown__item" href="/submit?studentId=' + id + '">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' +
          '作业' +
        '</a>' +
        '<button class="portal-dropdown__item portal-dropdown__item--danger" data-delete="' + id + '">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
          '删除' +
        '</button>';

      portal.appendChild(menu);

      // Measure after DOM insertion
      var menuW = menu.offsetWidth;
      var menuH = menu.offsetHeight || 72;

      // Horizontal: right-align to trigger, 16px right margin
      var left = Math.max(gap, Math.min(rect.right - menuW, window.innerWidth - menuW - 16));

      // Direction: avoid covering pagination bar
      var bottomIfDown = rect.bottom + menuH + gap;
      var direction = 'down';

      if (bottomIfDown > safeBottom) {
        // Downward would overlap pagination → go up
        direction = 'up';
      }

      // Edge case: upward would overflow viewport top → fallback down + scroll
      if (direction === 'up' && rect.top < menuH + gap) {
        direction = 'down';
        trigger.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }

      if (direction === 'up') {
        menu.style.top = (rect.top - menuH - gap) + 'px';
        menu.classList.add('portal-dropdown--up');
      } else {
        menu.style.top = (rect.bottom + gap) + 'px';
      }
      menu.style.left = left + 'px';

      openMenuId = id;
    }

    // Trigger button click → open portal menu
    studentTbody.addEventListener('click', function(e) {
      var trigger = e.target.closest('[data-action-trigger]');
      if (trigger) {
        e.stopPropagation();
        var id = trigger.dataset.actionTrigger;
        if (openMenuId === id) { closePortalMenu(); return; }
        openPortalMenu(trigger, id, trigger.dataset.studentName || '');
        return;
      }
    });

    // Delete button in portal menu
    portal.addEventListener('click', async function(e) {
      var delBtn = e.target.closest('[data-delete]');
      if (!delBtn) return;
      e.stopPropagation();
      var delId = delBtn.dataset.delete;
      closePortalMenu();
      if (!confirm('确定删除该学生吗？')) return;
      try {
        var delRes = await fetch('/api/students/' + delId, { method: 'DELETE' });
        if (!delRes.ok) { var delErr = await extractError(delRes); throw new Error(delErr); }
        showSuccess('已删除学生');
        await loadStudents();
      } catch (err) { showError(err.message); }
    });

    // Click outside closes menu
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.portal-dropdown') && !e.target.closest('[data-action-trigger]')) {
        closePortalMenu();
      }
    });

    // Escape closes menu
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (openMenuId != null) { closePortalMenu(); return; }
        if (!addDialog.classList.contains('hidden')) { closeAddDialog(); }
      }
    });

    // Close portal menu on scroll (menu stays fixed but trigger moves away)
    window.addEventListener('scroll', function() { closePortalMenu(); }, true);

    loadStudents();
  </script>
</body>
</html>
