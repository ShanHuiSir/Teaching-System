<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 学生管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="md-topbar">
    <span class="md-topbar__title">教学评价系统</span>
    <nav class="md-topbar__nav">
      <a href="/students" class="active">学生管理</a>
      <a href="/evaluation">作品评价</a>
      <a href="/export">导出成绩</a>
      <a href="/">退出</a>
    </nav>
  </header>

  <main class="md-container">
    <!-- Page Header -->
    <div class="page-header">
      <h2>学生管理</h2>
      <div class="page-header__actions">
        <button class="md-btn md-btn--filled" type="button">新增学生</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="md-toolbar">
      <div class="md-toolbar__search">
        <input
          class="md-field__input"
          type="search"
          placeholder="搜索姓名或学号..."
        >
      </div>
    </div>

    <!-- Student Table -->
    <div class="md-card">
      <table class="md-table">
        <thead>
          <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>班级</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2026001</td>
            <td>张三</td>
            <td><span class="md-chip">软件 1 班</span></td>
            <td>
              <a class="md-btn md-btn--tonal md-btn--sm" href="/evaluation">进入评价</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
