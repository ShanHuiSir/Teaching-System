<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 学生管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>教学评价系统</h1>
    <nav>
      <a href="/students">学生管理</a>
      <a href="/evaluation">作品评价</a>
      <a href="/export">导出成绩</a>
      <a href="/">退出</a>
    </nav>
  </header>
  <main class="container">
    <section class="panel">
      <div class="panel-header">
        <h2>学生列表</h2>
        <span class="status-text" id="studentStatus">正在加载学生数据...</span>
      </div>
      <form class="inline-form" id="studentForm">
        <label>
          学号
          <input name="studentNo" placeholder="2026001" required>
        </label>
        <label>
          姓名
          <input name="name" placeholder="张三" required>
        </label>
        <label>
          班级
          <input name="className" placeholder="软件 1 班" required>
        </label>
        <button type="submit">新增学生</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>班级</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <tr>
            <td colspan="4">正在加载...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script>
    const studentForm = document.querySelector("#studentForm");
    const studentStatus = document.querySelector("#studentStatus");
    const studentTableBody = document.querySelector("#studentTableBody");

    function setStatus(message, isError = false) {
      studentStatus.textContent = message;
      studentStatus.classList.toggle("error-text", isError);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadStudents() {
      try {
        const response = await fetch("/api/students");
        if (!response.ok) {
          throw new Error("学生列表加载失败");
        }

        const students = await response.json();
        if (students.length === 0) {
          studentTableBody.innerHTML = '<tr><td colspan="4">暂无学生，请先新增学生。</td></tr>';
        } else {
          studentTableBody.innerHTML = students.map(student => `
            <tr>
              <td>${escapeHtml(student.studentNo)}</td>
              <td>${escapeHtml(student.name)}</td>
              <td>${escapeHtml(student.className)}</td>
              <td class="action-cell">
                <a href="/evaluation?studentName=${encodeURIComponent(student.name)}">进入评价</a>
                <button class="button-secondary" type="button" data-delete-id="${student.id}">删除</button>
              </td>
            </tr>
          `).join("");
        }

        setStatus(`已加载 ${students.length} 名学生`);
      } catch (error) {
        studentTableBody.innerHTML = '<tr><td colspan="4">学生数据加载失败。</td></tr>';
        setStatus(error.message, true);
      }
    }

    studentForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(studentForm);
      const student = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("/api/students", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(student)
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.message || "新增学生失败");
        }

        studentForm.reset();
        setStatus(`已新增学生：${result.name}`);
        await loadStudents();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    studentTableBody.addEventListener("click", async (event) => {
      const deleteButton = event.target.closest("[data-delete-id]");
      if (!deleteButton) {
        return;
      }

      try {
        const response = await fetch(`/api/students/${deleteButton.dataset.deleteId}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.message || "删除学生失败");
        }

        setStatus("学生已删除");
        await loadStudents();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    loadStudents();
  </script>
</body>
</html>
