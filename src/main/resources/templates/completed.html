<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 已完成</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-sidebar">
  <th:block th:replace="~{fragments/sidebar :: sidebar(activePage='completed')}"></th:block>
  <main class="md-page">
    <div class="md-page-header">
      <h2>已完成</h2>
      <span class="md-page-header__status" id="page-status">正在加载...</span>
    </div>

    <div class="md-page-header__actions" style="display:flex;gap:var(--md-space-2);">
      <button class="md-btn md-btn--filled">导出 Excel</button>
      <button class="md-btn md-btn--outlined">导出 PDF</button>
      <button class="md-btn md-btn--tonal">归档</button>
    </div>

    <div class="md-card">
      <div class="md-card__header"><h3>提交作业</h3></div>
      <div class="md-card__body">
        <form class="md-form-grid md-form-grid--2" id="work-form">
          <label class="md-field"><span class="md-field__label">学生</span><select class="md-field__input" name="studentId" required id="student-select"><option value="">请选择学生</option></select></label>
          <label class="md-field"><span class="md-field__label">作业标题</span><input class="md-field__input" name="title" value="第二天实训作业" required></label>
          <label class="md-field"><span class="md-field__label">作业文件名</span><input class="md-field__input" name="fileName" value="student-work.zip" required></label>
          <label class="md-field"><span class="md-field__label">作业类型</span><select class="md-field__input" name="workType" required><option value="代码压缩包">代码压缩包</option><option value="实验报告">实验报告</option><option value="截图材料">截图材料</option><option value="其他">其他</option></select></label>
          <label class="md-field" style="grid-column:1/-1;"><span class="md-field__label">备注</span><textarea class="md-field__input" name="remark" placeholder="可填写作业说明"></textarea></label>
          <div style="grid-column:1/-1;"><button class="md-btn md-btn--filled" type="submit">保存作业提交</button></div>
        </form>
      </div>
    </div>

    <div class="md-card">
      <div class="md-card__body" style="padding:0;">
        <table class="md-table">
          <thead><tr><th>学生</th><th>作业标题</th><th>文件名</th><th>类型</th><th>最终分数</th><th>提交时间</th><th style="width:100px;">操作</th></tr></thead>
          <tbody id="table-body"><tr><td colspan="7">正在加载...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/snackbar.js"></script>
  <script src="/js/logout-dialog.js"></script>
  <script src="/js/assignment-page.js"></script>
  <script>initAssignmentPage('completed');</script>
</body>
</html>
