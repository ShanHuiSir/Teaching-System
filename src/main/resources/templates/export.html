<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 导出成绩</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-sidebar">
  <th:block th:replace="~{fragments/sidebar :: sidebar(activePage='export')}"></th:block>

  <main class="md-page">
    <div class="md-page-header">
      <h2>导出成绩</h2>
      <span class="md-page-header__status" id="page-status"></span>
      <div class="md-page-header__actions">
        <button class="md-btn md-btn--filled" type="button" id="btn-export">导出 Excel</button>
      </div>
    </div>

    <!-- Statistics Summary -->
    <div class="md-card">
      <div class="md-card__header">
        <h3>统计摘要</h3>
      </div>
      <div class="md-card__body">
        <div class="md-info-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">
          <div class="md-info-grid__item">
            <span class="md-info-grid__label">学生总数</span>
            <span class="md-info-grid__value" id="stat-student-count">--</span>
          </div>
          <div class="md-info-grid__item">
            <span class="md-info-grid__label">作业提交数</span>
            <span class="md-info-grid__value" id="stat-submission-count">--</span>
          </div>
          <div class="md-info-grid__item">
            <span class="md-info-grid__label">AI 已评价</span>
            <span class="md-info-grid__value" id="stat-ai-count">--</span>
          </div>
          <div class="md-info-grid__item">
            <span class="md-info-grid__label">教师已确认</span>
            <span class="md-info-grid__value" id="stat-teacher-count">--</span>
          </div>
          <div class="md-info-grid__item">
            <span class="md-info-grid__label">教师平均分</span>
            <span class="md-info-grid__value" id="stat-avg-score">--</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Export Records Placeholder -->
    <div class="md-card">
      <div class="md-card__header">
        <h3>导出记录</h3>
      </div>
      <div class="md-card__body">
        <div class="md-empty">
          <p id="export-empty-text">暂无导出记录</p>
          <span style="font: var(--md-typescale-body-small); color: var(--md-sys-color-on-surface-variant);">点击右上角按钮导出学生成绩汇总</span>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/logout-dialog.js"></script>
  <script>
    // DOM refs
    const pageStatus = document.getElementById('page-status');
    const btnExport = document.getElementById('btn-export');

    function setStatus(message, isError) {
      pageStatus.textContent = message;
      pageStatus.classList.toggle('error-text', !!isError);
    }

    // Load statistics summary
    async function loadSummary() {
      try {
        const res = await fetch('/api/statistics/summary');
        if (!res.ok) throw new Error('统计摘要加载失败');
        const data = await res.json();
        document.getElementById('stat-student-count').textContent = data.studentCount;
        document.getElementById('stat-submission-count').textContent = data.submissionCount;
        document.getElementById('stat-ai-count').textContent = data.aiEvaluatedCount;
        document.getElementById('stat-teacher-count').textContent = data.teacherConfirmedCount;
        document.getElementById('stat-avg-score').textContent = data.averageTeacherScore != null ? data.averageTeacherScore : '--';
      } catch (e) {
        setStatus(e.message, true);
      }
    }

    // Export
    btnExport.addEventListener('click', async function() {
      btnExport.disabled = true;
      btnExport.textContent = '导出中...';
      setStatus('正在生成导出文件...');
      try {
        const res = await fetch('/api/export/excel', { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || '导出失败');
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const disposition = res.headers.get('Content-Disposition');
        const match = disposition && disposition.match(/filename\*=UTF-8''(.+)/);
        a.download = match ? decodeURIComponent(match[1]) : '成绩汇总.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('');
        if (typeof showSuccess === 'function') {
          showSuccess('导出成功');
        }
      } catch (e) {
        setStatus(e.message, true);
        if (typeof showError === 'function') showError(e.message);
      } finally {
        btnExport.disabled = false;
        btnExport.textContent = '导出 Excel';
      }
    });

    // Init
    setStatus('正在加载...');
    loadSummary().then(function() { setStatus(''); });
  </script>
</body>
</html>
