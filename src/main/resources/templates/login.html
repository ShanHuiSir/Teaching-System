<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 登录</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-card__header">
      <h1>教学评价系统</h1>
      <p>教师端作业评价与成绩管理</p>
    </div>

    <div class="login-error" th:if="${error}" th:text="${error}"></div>

    <div class="quick-login" id="quick-login" style="display:none;">
      <span class="quick-login__label">快捷登录</span>
      <div class="quick-login__dropdown" id="quick-login-dropdown">
        <button class="quick-login__trigger quick-login__trigger--placeholder" id="quick-login-trigger" type="button">
          <span class="quick-login__trigger-text">选择已保存的账号</span>
          <svg class="quick-login__arrow" viewBox="0 0 24 24" width="20" height="20"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
        </button>
        <div class="quick-login__menu" id="quick-login-menu" hidden></div>
      </div>
    </div>

    <form class="login-form" method="post" action="/login" id="login-form">
      <label class="md-field">
        <span class="md-field__label">账号</span>
        <input class="md-field__input" name="username" id="username" placeholder="请输入教师账号" autocomplete="username" required>
      </label>
      <label class="md-field">
        <span class="md-field__label">密码</span>
        <input class="md-field__input" name="password" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      </label>
      <label style="display:flex;align-items:center;gap:var(--md-space-2);font:var(--md-typescale-body-small);color:var(--md-sys-color-on-surface-variant);cursor:pointer;">
        <input type="checkbox" id="remember-me" checked> 记住账号
      </label>
      <button class="md-btn md-btn--filled" type="submit">登录</button>
    </form>
  </main>

  <script>
    const STORAGE_KEY = 'saved-accounts';
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const quickLogin = document.getElementById('quick-login');
    const dropdown = document.getElementById('quick-login-dropdown');
    const trigger = document.getElementById('quick-login-trigger');
    const menu = document.getElementById('quick-login-menu');
    const rememberCheck = document.getElementById('remember-me');

    function getAccounts() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveAccounts(accounts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
    }

    function renderMenu() {
      var accounts = getAccounts();
      if (accounts.length === 0) {
        quickLogin.style.display = 'none';
        return;
      }
      quickLogin.style.display = '';
      menu.innerHTML = accounts.map(function(acc) {
        var initial = acc.charAt(0).toUpperCase();
        return '<div class="quick-login__item" data-username="' + acc.replace(/"/g, '&quot;') + '">'
          + '<span class="quick-login__avatar">' + initial + '</span>'
          + '<span class="quick-login__name">' + acc + '</span>'
          + '<button class="quick-login__remove" data-remove="' + acc.replace(/"/g, '&quot;') + '" type="button">&times;</button>'
          + '</div>';
      }).join('');
    }

    function openMenu() {
      menu.hidden = false;
      dropdown.classList.add('quick-login__dropdown--open');
    }

    function closeMenu() {
      menu.hidden = true;
      dropdown.classList.remove('quick-login__dropdown--open');
    }

    function toggleMenu() {
      if (menu.hidden) openMenu();
      else closeMenu();
    }

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMenu();
    });

    menu.addEventListener('click', function(e) {
      var removeBtn = e.target.closest('[data-remove]');
      if (removeBtn) {
        e.stopPropagation();
        var name = removeBtn.dataset.remove;
        var accounts = getAccounts().filter(function(a) { return a !== name; });
        saveAccounts(accounts);
        renderMenu();
        if (getAccounts().length === 0) closeMenu();
        return;
      }
      var item = e.target.closest('[data-username]');
      if (item) {
        var name = item.dataset.username;
        usernameInput.value = name;
        passwordInput.value = '123456';
        passwordInput.focus();
        closeMenu();
      }
    });

    document.addEventListener('click', function(e) {
      if (!dropdown.contains(e.target)) closeMenu();
    });

    document.getElementById('login-form').addEventListener('submit', function() {
      if (rememberCheck.checked) {
        var username = usernameInput.value.trim();
        if (username) {
          var accounts = getAccounts().filter(function(a) { return a !== username; });
          accounts.unshift(username);
          if (accounts.length > 5) accounts.pop();
          saveAccounts(accounts);
        }
      }
    });

    renderMenu();
  </script>
</body>
</html>
