<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 作品评价</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="md-topbar">
    <span class="md-topbar__title">教学评价系统</span>
    <nav class="md-topbar__nav">
      <a href="/students">学生管理</a>
      <a href="/evaluation" class="active">作品评价</a>
      <a href="/export">导出成绩</a>
      <a href="/">退出</a>
    </nav>
  </header>

  <main class="md-container">
    <!-- Student & Work Info -->
    <div class="md-card">
      <h2 style="font: var(--md-sys-typescale-title-large); margin-bottom: var(--md-spacing-lg);">作品评价</h2>
      <div class="md-form-grid md-form-grid--cols">
        <label class="md-field">
          <span class="md-field__label">学生</span>
          <input class="md-field__input" value="张三" readonly>
        </label>
        <label class="md-field">
          <span class="md-field__label">作品文件名</span>
          <input class="md-field__input" value="student-work.zip" readonly>
        </label>
      </div>
      <button class="md-btn md-btn--filled" type="button" style="margin-top: var(--md-spacing-lg);">执行 AI 评价</button>
    </div>

    <!-- AI Result -->
    <div class="md-card">
      <h2 style="font: var(--md-sys-typescale-title-large); margin-bottom: var(--md-spacing-lg);">AI 评价结果</h2>
      <div class="md-result-block">
        <span class="md-result-block__label">评分建议</span>
        <span class="md-result-block__score">85</span>
      </div>
      <div style="margin-top: var(--md-spacing-md);">
        <p style="margin-bottom: var(--md-spacing-sm);"><strong>主要问题：</strong>作品结构完整，但说明文档还不够清楚。</p>
        <p><strong>评语草稿：</strong>整体完成度较好，建议继续完善功能说明和测试截图。</p>
      </div>
    </div>

    <!-- Teacher Review -->
    <div class="md-card">
      <h2 style="font: var(--md-sys-typescale-title-large); margin-bottom: var(--md-spacing-lg);">教师复核</h2>
      <div class="md-form-grid md-form-grid--cols">
        <label class="md-field">
          <span class="md-field__label">最终分数</span>
          <input class="md-field__input" value="85">
        </label>
      </div>
      <label class="md-field" style="margin-top: var(--md-spacing-lg);">
        <span class="md-field__label">最终评语</span>
        <textarea class="md-field__input">整体完成度较好，继续优化细节。</textarea>
      </label>
      <button class="md-btn md-btn--filled" type="button" style="margin-top: var(--md-spacing-lg);">保存最终评价</button>
    </div>
  </main>
</body>
</html>
