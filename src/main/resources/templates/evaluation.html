<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 作品评价</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>教学评价系统</h1>
    <nav>
      <a href="/students">学生管理</a>
      <a href="/works">作品提交</a>
      <a href="/evaluation">作品评价</a>
      <a href="/export">导出成绩</a>
      <a href="/">退出</a>
    </nav>
  </header>
  <main class="container">
    <section class="panel">
      <h2>作品评价</h2>
      <form class="form-grid" id="evaluationForm">
        <label>
          学生
          <input name="studentName" value="张三" required>
        </label>
        <label>
          作品文件名
          <input name="fileName" value="student-work.zip" required>
        </label>
        <label>
          作品提交 ID
          <input name="submissionId" type="number" value="" required>
        </label>
        <button type="submit">点击 AI 评价</button>
      </form>
    </section>
    <section class="panel">
      <h2>AI 评价结果</h2>
      <p class="status-text" id="evaluationStatus">等待发起 AI 评价。</p>
      <p><strong>评分建议：</strong><span id="aiScore">-</span></p>
      <p><strong>主要问题：</strong></p>
      <pre class="result-box" id="aiIssues">-</pre>
      <p><strong>评语草稿：</strong></p>
      <pre class="result-box" id="aiComment">-</pre>
    </section>
    <section class="panel">
      <h2>教师复核</h2>
      <form class="form-grid" id="teacherReviewForm">
        <label>
          最终分数
          <input id="finalScore" type="number" min="0" max="100" step="0.01" value="">
        </label>
        <label>
          最终评语
          <textarea id="finalComment"></textarea>
        </label>
        <button type="submit">保存最终评价</button>
      </form>
    </section>
  </main>
  <script>
    const evaluationForm = document.querySelector("#evaluationForm");
    const evaluationStatus = document.querySelector("#evaluationStatus");
    const teacherReviewForm = document.querySelector("#teacherReviewForm");
    const aiScore = document.querySelector("#aiScore");
    const aiIssues = document.querySelector("#aiIssues");
    const aiComment = document.querySelector("#aiComment");
    const finalScore = document.querySelector("#finalScore");
    const finalComment = document.querySelector("#finalComment");

    const params = new URLSearchParams(window.location.search);
    const studentNameFromUrl = params.get("studentName");
    const fileNameFromUrl = params.get("fileName");
    const submissionIdFromUrl = params.get("submissionId");
    if (studentNameFromUrl) {
      evaluationForm.elements.studentName.value = studentNameFromUrl;
    }
    if (fileNameFromUrl) {
      evaluationForm.elements.fileName.value = fileNameFromUrl;
    }
    if (submissionIdFromUrl) {
      evaluationForm.elements.submissionId.value = submissionIdFromUrl;
    }

    function setEvaluationStatus(message, isError = false) {
      evaluationStatus.textContent = message;
      evaluationStatus.classList.toggle("error-text", isError);
    }

    evaluationForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(evaluationForm);
      const payload = Object.fromEntries(formData.entries());
      payload.submissionId = Number(payload.submissionId);

      setEvaluationStatus("AI 正在评价...");

      try {
        const response = await fetch("/api/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("AI 评价失败");
        }

        const result = await response.json();
        aiScore.textContent = result.aiScore ?? "-";
        aiIssues.textContent = result.aiIssues || "-";
        aiComment.textContent = result.aiComment || "-";
        finalScore.value = result.aiScore ?? "";
        finalComment.value = result.aiComment || "";
        setEvaluationStatus("AI 评价完成");
      } catch (error) {
        setEvaluationStatus(error.message, true);
      }
    });

    teacherReviewForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submissionId = Number(evaluationForm.elements.submissionId.value);
      const payload = {
        teacherScore: Number(finalScore.value),
        teacherComment: finalComment.value
      };

      setEvaluationStatus("正在保存教师最终评价...");

      try {
        const response = await fetch(`/api/submissions/${submissionId}/teacher-review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.message || "教师最终评价保存失败");
        }

        finalScore.value = result.teacherScore ?? "";
        finalComment.value = result.teacherComment || "";
        setEvaluationStatus("教师最终评价已保存");
      } catch (error) {
        setEvaluationStatus(error.message, true);
      }
    });
  </script>
</body>
</html>
