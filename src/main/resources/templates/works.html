<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 作品提交</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-sidebar">
  <th:block th:replace="~{fragments/sidebar :: sidebar(activePage='works')}"></th:block>
  <main class="md-page">
    <div class="md-page-header">
      <h2>作品提交</h2>
      <span class="md-page-header__status" id="work-status">正在加载...</span>
    </div>

    <div class="md-card">
      <div class="md-card__header">
        <h3>提交作品</h3>
      </div>
      <div class="md-card__body">
        <form class="md-form-grid md-form-grid--2" id="work-form">
          <label class="md-field">
            <span class="md-field__label">学生</span>
            <select class="md-field__input" name="studentId" required id="student-select">
              <option value="">请选择学生</option>
            </select>
          </label>
          <label class="md-field">
            <span class="md-field__label">作品标题</span>
            <input class="md-field__input" name="title" value="第二天实训作品" required>
          </label>
          <label class="md-field">
            <span class="md-field__label">作品文件名</span>
            <input class="md-field__input" name="fileName" value="student-work.zip" required>
          </label>
          <label class="md-field">
            <span class="md-field__label">作品类型</span>
            <select class="md-field__input" name="workType" required>
              <option value="代码压缩包">代码压缩包</option>
              <option value="实验报告">实验报告</option>
              <option value="截图材料">截图材料</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label class="md-field" style="grid-column: 1 / -1;">
            <span class="md-field__label">备注</span>
            <textarea class="md-field__input" name="remark" placeholder="可填写作品说明"></textarea>
          </label>
          <div style="grid-column: 1 / -1;">
            <button class="md-btn md-btn--filled" type="submit">保存作品提交</button>
          </div>
        </form>
      </div>
    </div>

    <div class="md-card">
      <div class="md-card__header">
        <h3>作品列表</h3>
      </div>
      <div class="md-card__body" style="padding: 0;">
        <table class="md-table">
          <thead>
            <tr>
              <th>学生</th>
              <th>作品标题</th>
              <th>文件名</th>
              <th>类型</th>
              <th>提交时间</th>
              <th style="width: 100px;">操作</th>
            </tr>
          </thead>
          <tbody id="work-table-body">
            <tr>
              <td colspan="6">正在加载...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="md-dialog-overlay hidden" id="logout-dialog">
    <div class="md-dialog">
      <svg class="md-dialog__icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <div class="md-dialog__title">确认退出</div>
      <div class="md-dialog__body">退出后需要重新登录，确定要退出吗？</div>
      <div class="md-dialog__actions">
        <button class="md-btn md-btn--outlined" type="button" id="logout-cancel">取消</button>
        <button class="md-btn md-btn--danger" type="button" id="logout-confirm">确定退出</button>
      </div>
    </div>
  </div>

  <script>
    // Logout dialog
    const l = document.querySelector('.logout-link');
    const d = document.getElementById('logout-dialog');
    document.getElementById('logout-cancel').onclick = () => { d.classList.add('hidden'); l.focus(); };
    document.getElementById('logout-confirm').onclick = () => { location.href = '/'; };
    l.onclick = e => { e.preventDefault(); d.classList.remove('hidden'); document.getElementById('logout-cancel').focus(); };
    d.onclick = e => { if (e.target === d) { d.classList.add('hidden'); l.focus(); } };
    document.onkeydown = e => { if (e.key === 'Escape' && !d.classList.contains('hidden')) { d.classList.add('hidden'); l.focus(); } };

    // Form handling
    const workForm = document.querySelector("#work-form");
    const workStatus = document.querySelector("#work-status");
    const studentSelect = document.querySelector("#student-select");
    const workTableBody = document.querySelector("#work-table-body");
    const params = new URLSearchParams(window.location.search);
    const selectedStudentId = params.get("studentId");

    function setStatus(message, isError = false) {
      workStatus.textContent = message;
      workStatus.classList.toggle("error-text", isError);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadStudents() {
      const response = await fetch("/api/students");
      if (!response.ok) {
        throw new Error("学生列表加载失败");
      }

      const students = await response.json();
      studentSelect.innerHTML = '<option value="">请选择学生</option>' + students.map(student => `
        <option value="${student.id}">${escapeHtml(student.studentNo)} - ${escapeHtml(student.name)}</option>
      `).join("");

      if (selectedStudentId) {
        studentSelect.value = selectedStudentId;
      }
    }

    async function loadWorks() {
      const response = await fetch("/api/submissions");
      if (!response.ok) {
        throw new Error("作品列表加载失败");
      }

      const works = await response.json();
      if (works.length === 0) {
        workTableBody.innerHTML = '<tr><td colspan="6">暂无作品，请先提交。</td></tr>';
      } else {
        workTableBody.innerHTML = works.map(work => `
          <tr>
            <td>${escapeHtml(work.studentName)}</td>
            <td>${escapeHtml(work.title)}</td>
            <td>${escapeHtml(work.fileName)}</td>
            <td>${escapeHtml(work.workType)}</td>
            <td>${escapeHtml((work.submittedAt || "").replace("T", " ").slice(0, 16))}</td>
            <td>
              <a class="md-btn md-btn--tonal md-btn--sm" href="/evaluation?submissionId=${work.id}&studentName=${encodeURIComponent(work.studentName)}&fileName=${encodeURIComponent(work.fileName)}">评价</a>
            </td>
          </tr>
        `).join("");
      }

      setStatus(`已加载 ${works.length} 条作品提交`);
    }

    async function initPage() {
      try {
        await loadStudents();
        await loadWorks();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    workForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(workForm);
      const payload = Object.fromEntries(formData.entries());
      payload.studentId = Number(payload.studentId);

      try {
        const response = await fetch("/api/submissions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.message || "保存作品失败");
        }

        workForm.reset();
        setStatus(`已保存作品：${result.title}`);
        await loadWorks();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    initPage();
  </script>
</body>
</html>
