<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学评价系统 - 作业提交记录</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-sidebar">
  <th:block th:replace="~{fragments/sidebar :: sidebar(activePage='works')}"></th:block>
  <main class="md-page">
    <div class="md-page-header">
      <h2>作业提交记录</h2>
      <span class="md-page-header__status" id="work-status">正在加载...</span>
    </div>

    <div class="md-card">
      <div class="md-card__header">
        <h3>提交记录</h3>
      </div>
      <div class="md-card__body" style="padding: 0;">
        <table class="md-table">
          <thead>
            <tr>
              <th>学生</th>
              <th>作业标题</th>
              <th>文件名</th>
              <th>类型</th>
              <th>提交时间</th>
              <th style="width: 100px;">操作</th>
            </tr>
          </thead>
          <tbody id="work-table-body">
            <tr>
              <td colspan="6">正在加载...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/logout-dialog.js"></script>
  <script>
    const workStatus = document.querySelector("#work-status");
    const workTableBody = document.querySelector("#work-table-body");

    function setStatus(message, isError) {
      workStatus.textContent = message;
      workStatus.classList.toggle("error-text", isError);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    async function loadWorks() {
      try {
        const res = await fetch("/api/submissions");
        if (!res.ok) throw new Error("作业提交记录加载失败");
        const works = await res.json();
        if (works.length === 0) {
          workTableBody.innerHTML = '<tr><td colspan="6">暂无作业，请先提交。</td></tr>';
        } else {
          workTableBody.innerHTML = works.map(work => `
            <tr>
              <td>${escapeHtml(work.studentName)}</td>
              <td>${escapeHtml(work.title)}</td>
              <td>${escapeHtml(work.fileName)}</td>
              <td>${escapeHtml(work.workType)}</td>
              <td>${escapeHtml((work.submittedAt || "").replace("T", " ").slice(0, 16))}</td>
              <td>
                <a class="md-btn md-btn--tonal md-btn--sm" href="/evaluation?submissionId=${work.id}&studentId=${work.studentId}&studentName=${encodeURIComponent(work.studentName)}&fileName=${encodeURIComponent(work.fileName)}">评价</a>
              </td>
            </tr>
          `).join("");
        }
        setStatus(`已加载 ${works.length} 条作业提交`);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    loadWorks();
  </script>
</body>
</html>
