# Docker Compose profile. Service names below resolve inside the compose network.
spring.datasource.url=jdbc:h2:mem:teachingeval;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

app.auth.cookie-secure=false

app.ai.real.enabled=${APP_AI_REAL_ENABLED:true}
app.ai.real.endpoint-url=${APP_AI_REAL_ENDPOINT_URL:http://ai-service:8000/api/evaluate/real}
app.preprocess.enabled=${APP_PREPROCESS_ENABLED:false}
app.preprocess.endpoint-url=${APP_PREPROCESS_ENDPOINT_URL:http://ai-service:8000/api/preprocess}
app.ai.eval-log.enabled=${APP_AI_EVAL_LOG_ENABLED:false}
app.ai.eval-log-url=${APP_AI_EVAL_LOG_URL:http://ai-service:8000/api/eval-log}
