<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教学评价系统</title>
    <style>
      html::-webkit-scrollbar, body::-webkit-scrollbar, div::-webkit-scrollbar { width: 8px; height: 8px; }
      html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, div::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 4px; }
      html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
      html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover, div::-webkit-scrollbar-thumb:hover { background: #6b7280; }
      * { scrollbar-width: thin; scrollbar-color: #9ca3af #e5e7eb; }
    </style>
  </head>
  <body>
    <div id="app">
      <style>
        #app { display:flex; align-items:center; justify-content:center; height:100vh; background:#f4fbfa; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
        @media (prefers-color-scheme:dark) { #app { background:#0e1514; } }
        .loader { display:flex; flex-direction:column; align-items:center; gap:12px; }
        .loader-ring { width:36px; height:36px; border:3px solid #e2e9e9; border-top-color:#006a6a; border-radius:50%; animation:ld-spin .7s linear infinite; }
        @media (prefers-color-scheme:dark) { .loader-ring { border-color:#252f2f; border-top-color:#80d5d4; } }
        @keyframes ld-spin { to { transform:rotate(360deg); } }
        .loader-text { font-size:14px; color:#6d7978; letter-spacing:.04em; }
        @media (prefers-color-scheme:dark) { .loader-text { color:#bec9c8; } }
      </style>
      <div class="loader">
        <div class="loader-ring"></div>
        <span class="loader-text">潮平两岸阔，风正一帆悬</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
