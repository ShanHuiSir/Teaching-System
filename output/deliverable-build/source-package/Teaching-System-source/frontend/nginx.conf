# 使用 Docker 内嵌 DNS 做动态解析，避免容器重建后 IP 变化导致 502
# valid=10s：DNS 缓存 10 秒后重新解析
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    # AI 服务代理（流式响应，禁用缓冲）
    # rewrite + 变量 proxy_pass 组合：rewrite 剥离 /ai 前缀，变量强制动态 DNS 解析
    location /ai/ {
        set $ai_upstream ai-service:8000;
        rewrite ^/ai(.*)$ $1 break;
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        return 200 "frontend ok";
        add_header Content-Type text/plain;
    }

    # 心跳 SSE 代理
    location = /api/heartbeat {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 代理
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
