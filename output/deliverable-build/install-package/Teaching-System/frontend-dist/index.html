<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教学评价系统</title>
    <link rel="preload" href="/IBMPlexMono-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/IBMPlexMono-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      html.ld-lock { overflow: hidden; }

      body { margin: 0; }

      /* ── 加载界面全屏遮罩，独立于 #app，Vue 挂载后由 router.isReady() 触发淡出 ── */
      #ld-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
        background: #f4fbfa;
        transition: opacity 0.3s ease;
      }
      #ld-root.ld-done {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) { #ld-root { background: #0e1514; } }

      #ld-root .ld-head {
        position: relative;
        display: flex;
        justify-content: center;
      }

      #ld-root .ld-brand {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      #ld-root .ld-brand-top {
        display: flex;
        align-items: center;
      }

      #ld-root .ld-aitas {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        color: #161d1d;
        letter-spacing: 0.16em;
      }
      @media (prefers-color-scheme: dark) { #ld-root .ld-aitas { color: #dde4e3; } }

      #ld-root .ld-logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        object-fit: cover;
        flex-shrink: 0;
      }

      #ld-root .ld-pct {
        position: absolute;
        right: 0;
        bottom: 0;
        transform: translateX(calc(100% + 120px));
        font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        display: inline-block;
        min-width: 34px;
        text-align: right;
        color: #3f4948;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-color-scheme: dark) { #ld-root .ld-pct { color: #bec9c8; } }

      #ld-root .ld-track {
        position: relative;
        width: 480px;
        height: 2px;
        background: transparent;
        border-radius: 1px;
      }

      #ld-root .ld-bar {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 100%;
        border-radius: 1px;
        background: #006a6a;
      }
      @media (prefers-color-scheme: dark) { #ld-root .ld-bar { background: #80d5d4; } }

      #ld-root .ld-spacer {
        height: 154px;
        flex-shrink: 0;
      }

      #ld-root .ld-label {
        position: absolute;
        top: calc(50% + 10px);
        left: calc(50% + 203px);
        font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 400;
        line-height: 1;
        color: #3f4948;
        letter-spacing: 0.06em;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }
      @media (prefers-color-scheme: dark) { #ld-root .ld-label { color: #bec9c8; } }
    </style>
    <script type="module" crossorigin src="/assets/index-fvBw-JMi.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-eFeTxypT.css">
  </head>
  <body>
    <div id="ld-root">
      <div class="ld-head">
        <div class="ld-brand">
          <span class="ld-brand-top">
            <span class="ld-aitas">AI</span>
            <svg class="ld-logo" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
              <image href="/favicon.png" width="72" height="72" />
            </svg>
          </span>
          <span class="ld-aitas">TAS</span>
        </div>
        <span class="ld-pct">0%</span>
      </div>
      <div class="ld-track">
        <div class="ld-bar"></div>
      </div>
      <div class="ld-spacer"></div>
      <p class="ld-label">加载资源中…</p>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var root = document.getElementById('ld-root')
        var bar = root.querySelector('.ld-bar')
        var track = root.querySelector('.ld-track')
        var pctEl = root.querySelector('.ld-pct')
        var labelEl = root.querySelector('.ld-label')

        var current = 0     // 当前实际显示值
        var target = 0      // 里程碑目标值
        var running = false

        function lerp(a, b, t) { return a + (b - a) * t }

        function apply(p) {
          var pct = Math.round(p)
          pctEl.textContent = pct + '%'
          bar.style.width = 'calc(2px + (100% - 2px) * ' + (p / 100) + ')'
          track.style.width = 'calc(480px + (120vw - 480px) * ' + (p / 100) + ')'
          if (p < 35) labelEl.textContent = '权限检查中…'
          else if (p < 55) labelEl.textContent = '初始化应用…'
          else if (p < 90) labelEl.textContent = '加载页面…'
          else labelEl.textContent = '即将完成…'
        }

        function tick() {
          // 平滑追赶目标值
          current = lerp(current, target, 0.08)

          // 微漂移：与目标差距 < 0.5% 且未达终值时，缓慢推进目标，杜绝"卡死感"
          if (target < 100 && target - current < 0.5) {
            target = Math.min(target + 0.04, 100)
          }

          // 终值收束
          if (target >= 100 && current > 99.95) {
            current = 100
          }

          apply(current)

          if (current < 100) {
            requestAnimationFrame(tick)
          } else {
            running = false
          }
        }

        // 全局进度控制器 — main.ts 通过此函数推进里程碑
        window.__setLoadingProgress = function (p) {
          target = Math.max(target, p)  // 目标只升不降
          if (!running) {
            running = true
            requestAnimationFrame(tick)
          }
        }

        document.documentElement.classList.add('ld-lock')

        var session = null

        async function run() {
          // 等待首帧绘制
          await new Promise(function (r) { requestAnimationFrame(r) })
          await new Promise(function (r) { requestAnimationFrame(r) })
          window.__setLoadingProgress(5)

          // Phase 0–1: 权限检查 (→ 35%)
          try {
            var res = await fetch('/api/auth/me', { credentials: 'include' })
            if (res.ok) {
              var body = await res.json()
              if (body && body.code === 200) session = body.data
            }
          } catch (_) { /* 网络错误 → 视为未登录 */ }
          window.__setLoadingProgress(35)

          // 交接给 main.ts
          window.__initialSession = session || null
          window.__loadingComplete = true
          window.dispatchEvent(new Event('loading-complete'))
        }

        run()
      })()
    </script>
  </body>
</html>
