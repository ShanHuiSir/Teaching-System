name: Pure Java Direct Deploy

on:
  push:
    branches:
      - main  # 监听的分支，根据实际情况可改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库最新代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17 环境
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/main/java/com/teachingeval/App.java

      # 4. 将编译好的 out 目录直接同步到服务器
      - name: Upload Build Artifacts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "out/"
          target: "/usr/share/nginx/teaching-system"

      # 5. 远程连接服务器，安全重启 Java 服务
      - name: Execute SSH Commands to Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /usr/share/nginx/teaching-system
            
            PID=$(pgrep -f "com.teachingeval.App") || true
            if [ ! -z "$PID" ]; then
                echo "发现正在运行的旧服务 (PID: $PID)，正在关闭..."
                kill -15 $PID
                sleep 3
            fi
            echo "正在启动新服务..."
            nohup java -cp out com.teachingeval.App > app.log 2>&1 &
            
            echo "🎉 部署完成！"
