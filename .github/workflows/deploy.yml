name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package -B -DskipTests

      - name: Prepare JAR
        run: |
          JAR=$(ls target/Teaching-System-*.jar | grep -v '\.original$' | head -1)
          cp "$JAR" target/app.jar

      - name: Deploy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "target/app.jar"
          target: "/usr/share/teaching-system"
          strip_components: 1

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set APP_DIR "/usr/share/teaching-system"
            set JAR_FILE "$APP_DIR/app.jar"
            set LOG_FILE "$APP_DIR/app.log"
            set PORT 8080
            set MAX_WAIT 30

            # ── 停止占用端口的旧进程 ──
            echo "=== 检查端口 $PORT 上的旧进程 ==="
            set OLD_PIDS (lsof -t -i:$PORT 2>/dev/null)

            if test -n "$OLD_PIDS"
              for OLD_PID in $OLD_PIDS
                echo "发现旧进程 PID: $OLD_PID，发送 SIGTERM..."
                kill -15 "$OLD_PID" 2>/dev/null; or true
              end

              set RETRY 0
              while test $RETRY -lt 10
                set STILL_ALIVE (lsof -t -i:$PORT 2>/dev/null)
                if test -z "$STILL_ALIVE"
                  break
                end
                sleep 1
                set RETRY (math $RETRY + 1)
              end

              set STUBBORN (lsof -t -i:$PORT 2>/dev/null)
              if test -n "$STUBBORN"
                echo "进程未响应 SIGTERM，强制终止..."
                for P in $STUBBORN
                  kill -9 "$P" 2>/dev/null; or true
                end
                sleep 1
              end
            end

            set LEFTOVER (lsof -t -i:$PORT 2>/dev/null)
            if test -n "$LEFTOVER"
              echo "错误：无法释放端口 $PORT，残留进程 PID: $LEFTOVER"
              exit 1
            end

            echo "端口 $PORT 已释放。"

            # ── 启动新服务并轮询端口 ──
            echo "=== 启动新服务 ==="
            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

            set ELAPSED 0
            set STARTED 0

            while test $ELAPSED -lt $MAX_WAIT
              sleep 1
              set ELAPSED (math $ELAPSED + 1)
              set NEW_PID (lsof -t -i:$PORT 2>/dev/null)
              if test -n "$NEW_PID"
                set STARTED 1
                break
              end
            end

            if test $STARTED -eq 1
              echo "部署成功！新服务 PID: $NEW_PID，监听端口: $PORT"
            else
              echo "启动失败！等待了 $MAX_WAIT 秒后端口 $PORT 仍未监听。"
              echo "--- 最近日志 ---"
              tail -50 "$LOG_FILE"
              exit 1
            end
