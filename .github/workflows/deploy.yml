name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/main/java/com/teachingeval/App.java

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "out"
          target: "/usr/share/nginx/teaching-system"

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/usr/share/nginx/teaching-system"
            PID_FILE="$APP_DIR/app.pid"

            cd "$APP_DIR"

            # 停止旧服务
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")
              if kill -0 "$OLD_PID" 2>/dev/null; then
                echo "正在停止旧服务 (PID: $OLD_PID)..."
                kill -15 "$OLD_PID"
                # 等待最多 10 秒
                for i in $(seq 1 10); do
                  kill -0 "$OLD_PID" 2>/dev/null || break
                  sleep 1
                done
                # 仍未退出则强制终止
                kill -0 "$OLD_PID" 2>/dev/null && kill -9 "$OLD_PID" || true
              fi
              rm -f "$PID_FILE"
            fi

            # 启动新服务
            echo "正在启动新服务..."
            nohup java -cp out com.teachingeval.App > app.log 2>&1 &
            NEW_PID=$!
            echo "$NEW_PID" > "$PID_FILE"

            # 等待启动
            sleep 3

            if kill -0 "$NEW_PID" 2>/dev/null; then
              echo "部署完成 (PID: $NEW_PID)"
            else
              echo "启动失败，最近日志："
              tail -20 app.log
              exit 1
            fi
