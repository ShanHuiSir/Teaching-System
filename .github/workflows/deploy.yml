name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package -B -DskipTests

      - name: Prepare JAR
        run: |
          JAR=$(ls target/Teaching-System-*.jar | grep -v '\.original$' | head -1)
          cp "$JAR" target/app.jar

      - name: Deploy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "target/app.jar"
          target: "/usr/share/teaching-system"
          strip_components: 1

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 服务器默认 Shell 是 Fish（< 3.5 不支持 heredoc），通过 bash -c 配合单引号多行字符串切换至 Bash
          script: |
            bash -c '
            set -euo pipefail

            APP_DIR="/usr/share/teaching-system"
            JAR_FILE="$APP_DIR/app.jar"
            LOG_FILE="$APP_DIR/app.log"
            PORT=8080
            MAX_WAIT=30

            # ── 停止占用端口的旧进程 ──
            echo "=== 检查端口 $PORT 上的旧进程 ==="
            OLD_PIDS=$(lsof -t -i:$PORT 2>/dev/null || true)

            if [ -n "$OLD_PIDS" ]; then
              for OLD_PID in $OLD_PIDS; do
                echo "发现旧进程 PID: $OLD_PID，发送 SIGTERM..."
                kill -15 "$OLD_PID" 2>/dev/null || true
              done

              RETRY=0
              while [ $RETRY -lt 10 ]; do
                STILL_ALIVE=$(lsof -t -i:$PORT 2>/dev/null || true)
                if [ -z "$STILL_ALIVE" ]; then
                  break
                fi
                sleep 1
                RETRY=$((RETRY + 1))
              done

              STUBBORN=$(lsof -t -i:$PORT 2>/dev/null || true)
              if [ -n "$STUBBORN" ]; then
                echo "进程未响应 SIGTERM，强制终止..."
                for P in $STUBBORN; do
                  kill -9 "$P" 2>/dev/null || true
                done
                sleep 1
              fi
            fi

            LEFTOVER=$(lsof -t -i:$PORT 2>/dev/null || true)
            if [ -n "$LEFTOVER" ]; then
              echo "错误：无法释放端口 $PORT，残留进程 PID: $LEFTOVER"
              exit 1
            fi

            echo "端口 $PORT 已释放。"

            # ── 启动新服务并轮询端口 ──
            echo "=== 启动新服务 ==="
            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

            ELAPSED=0
            STARTED=0

            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep 1
              ELAPSED=$((ELAPSED + 1))
              NEW_PID=$(lsof -t -i:$PORT 2>/dev/null || true)
              if [ -n "$NEW_PID" ]; then
                STARTED=1
                break
              fi
            done

            if [ $STARTED -eq 1 ]; then
              echo "部署成功！新服务 PID: $NEW_PID，监听端口: $PORT"
            else
              echo "启动失败！等待了 $MAX_WAIT 秒后端口 $PORT 仍未监听。"
              echo "--- 最近日志 ---"
              tail -50 "$LOG_FILE"
              exit 1
            fi
            '
