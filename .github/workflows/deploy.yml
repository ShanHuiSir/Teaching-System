name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn compile -B

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "target/classes"
          target: "/usr/share/nginx/teaching-system"

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set APP_DIR "/usr/share/nginx/teaching-system"
            set PID_FILE "$APP_DIR/app.pid"

            cd "$APP_DIR"

            # 停止旧服务
            if test -f "$PID_FILE"
              set OLD_PID (cat "$PID_FILE")
              if kill -0 "$OLD_PID" 2>/dev/null
                echo "正在停止旧服务 (PID: $OLD_PID)..."
                kill -15 "$OLD_PID"
                for i in (seq 1 10)
                  if not kill -0 "$OLD_PID" 2>/dev/null
                    break
                  end
                  sleep 1
                end
                if kill -0 "$OLD_PID" 2>/dev/null
                  kill -9 "$OLD_PID"
                end
              end
              rm -f "$PID_FILE"
            end

            # 启动新服务
            echo "正在启动新服务..."
            nohup java -cp target/classes com.teachingeval.App > app.log 2>&1 &
            set NEW_PID $last_pid
            echo "$NEW_PID" > "$PID_FILE"

            sleep 3

            if kill -0 "$NEW_PID" 2>/dev/null
              echo "部署完成 (PID: $NEW_PID)"
            else
              echo "启动失败，最近日志："
              tail -20 app.log
              exit 1
            end
