name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven Mirror (Aliyun)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'MVNEOF'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Maven Mirror</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          MVNEOF

      - name: Maven Package
        run: mvn package -B

      - name: Prepare JAR
        run: |
          JAR=$(ls target/Teaching-System-*.jar | grep -v '\.original$' | head -1)
          cp "$JAR" target/app.jar

      # ── Frontend ──────────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm config set registry https://registry.npmmirror.com
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      # ── Stage artifacts ──────────────────────────────────────────

      - name: Stage Deploy Directory
        run: |
          mkdir -p deploy
          cp target/app.jar deploy/
          cp -r frontend/dist deploy/
          cp -r ai-service deploy/

      # ── Deploy to server ─────────────────────────────────────────

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/
          target: /usr/share/teaching-system
          strip_components: 1
          rm: false

      # ── Restart all services ──────────────────────────────────────

      - name: Restart Services
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            bash -c '
            set -euo pipefail

            BASE="/usr/share/teaching-system"
            JAVA_PORT=8080
            AI_PORT=8000
            MAX_WAIT=30

            # ── Stop Java ──────────────────────────────────────────
            stop_port() {
              local PORT=$1 NAME=$2
              echo "=== 停止 $NAME (端口 $PORT) ==="
              PIDS=$(lsof -t -i:$PORT 2>/dev/null || true)
              if [ -z "$PIDS" ]; then
                echo "端口 $PORT 无运行中进程。"
                return
              fi
              for PID in $PIDS; do
                echo "终止 PID $PID..."
                kill -15 "$PID" 2>/dev/null || true
              done
              for i in $(seq 1 10); do
                STILL=$(lsof -t -i:$PORT 2>/dev/null || true)
                [ -z "$STILL" ] && break
                sleep 1
              done
              STUBBORN=$(lsof -t -i:$PORT 2>/dev/null || true)
              if [ -n "$STUBBORN" ]; then
                for P in $STUBBORN; do kill -9 "$P" 2>/dev/null || true; done
                sleep 1
              fi
              LEFTOVER=$(lsof -t -i:$PORT 2>/dev/null || true)
              if [ -n "$LEFTOVER" ]; then
                echo "错误：无法释放端口 $PORT，残留 PID: $LEFTOVER"
                exit 1
              fi
              echo "端口 $PORT 已释放。"
            }

            stop_port $JAVA_PORT "Java"
            stop_port $AI_PORT   "AI 服务"

            # ── Python venv + deps ─────────────────────────────────
            echo "=== 初始化 Python 环境 ==="
            AI_DIR="$BASE/ai-service"
            cd "$AI_DIR"

            # recreate venv if interpeter changed or stale
            NEED_VENV=0
            [ ! -d .venv ] && NEED_VENV=1
            [ -d .venv ] && [ "$(.venv/bin/python -V 2>/dev/null || echo none)" != "Python 3.13.0" ] && NEED_VENV=1
            if [ $NEED_VENV -eq 1 ]; then
              rm -rf .venv
              /usr/local/bin/python3.13 -m venv .venv
            fi
            source .venv/bin/activate

            # install deps with retry
            for attempt in 1 2 3; do
              echo "pip install attempt $attempt..."
              if pip install --timeout 120 --retries 5 -r requirements.txt \
                 && pip install --timeout 120 --retries 5 -e DocxConv -e Evaluator -e ScreenshotProc -e ArchiveProc; then
                echo "pip install OK"
                break
              fi
              echo "pip install attempt $attempt failed, retrying..."
              sleep 5
            done || { echo "pip install failed after 3 attempts"; exit 1; }

            # DEEPSEEK_API_KEY .env
            cat > .env << 'ENVEOF'
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=https://api.deepseek.com
            DEEPSEEK_MODEL=deepseek-v4-pro
            DEEPSEEK_THINKING=false
            DEEPSEEK_REASONING_EFFORT=high
            AI_SERVICE_HOST=0.0.0.0
            AI_SERVICE_PORT=8000
            AI_SERVICE_SERVER_URL=/ai
            OCR_ENABLED=false
            ENVEOF
            chmod 600 .env

            # ── Start AI Service ───────────────────────────────────
            echo "=== 启动 AI 服务 (端口 $AI_PORT) ==="
            nohup .venv/bin/python -m docxconv serve > "$BASE/ai-service.log" 2>&1 &
            AI_STARTED=0
            for i in $(seq 1 $MAX_WAIT); do
              sleep 1
              if lsof -t -i:$AI_PORT >/dev/null 2>&1; then
                AI_STARTED=1
                break
              fi
            done
            if [ $AI_STARTED -eq 0 ]; then
              echo "AI 服务启动失败！"
              tail -30 "$BASE/ai-service.log"
              exit 1
            fi
            echo "AI 服务启动成功。"

            # ── Start Java ─────────────────────────────────────────
            echo "=== 启动 Java (端口 $JAVA_PORT) ==="
            nohup java -jar "$BASE/app.jar" > "$BASE/app.log" 2>&1 &
            JAVA_STARTED=0
            for i in $(seq 1 $MAX_WAIT); do
              sleep 1
              if lsof -t -i:$JAVA_PORT >/dev/null 2>&1; then
                JAVA_STARTED=1
                break
              fi
            done
            if [ $JAVA_STARTED -eq 0 ]; then
              echo "Java 启动失败！"
              tail -30 "$BASE/app.log"
              exit 1
            fi
            echo "Java 启动成功。"
            echo "=== 部署完成 ==="
            '
